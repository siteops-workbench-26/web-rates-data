name: Refresh public mortgage rate data (staging)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-rates.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
  schedule:
    - cron: '17 9,13,17 * * *'
      timezone: 'America/New_York'
permissions:
  contents: read
concurrency:
  group: public-mortgage-rates
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out public scraper
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test public featured-rate parsing
        run: npm test
      - name: Read publicly advertised mortgage rates
        run: npm run update
      - name: Validate public data candidate
        run: node scripts/validate-feed.mjs
      - name: Transfer only validated public JSON
        uses: actions/upload-artifact@v4
        with:
          name: validated-public-rates
          path: docs/rates.json
          retention-days: 3
  publish:
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
      - name: Retrieve validated JSON
        uses: actions/download-artifact@v4
        with:
          name: validated-public-rates
          path: docs/
      - name: Recheck JSON separately from browser process
        run: node scripts/validate-feed.mjs
      - name: Commit public rate snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/rates.json
          git commit -m 'Update publicly advertised mortgage rate snapshot'
          git push origin HEAD:main
